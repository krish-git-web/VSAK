<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSAK | Official Site</title>
  <style>
    /* Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Top Utility Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      padding: 8px 40px;
      font-size: 13px;
      color: #00338d;
      background-color: #fff;
    }

    .top-bar a:hover {
      text-decoration: underline;
    }

    /* Main Navigation Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 40px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Logo Image Container */
    .brand-logo-img {
      height: 125px;
      width: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply; 
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      font-size: 20px;
      font-weight: 600;
      color: #4a4a4a;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: #00338d;
    }

    /* Contact Button */
    .contact-btn {
      background-color: #00338d;
      color: #ffffff !important;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.2s ease;
    }

    .contact-btn:hover {
      background-color: #002266;
    }

    /* Secondary Navigation Bar */
    .sub-header {
      background-color: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 40px;
      display: flex;
      gap: 25px;
      font-size: 13px;
      color: #666666;
    }

    .sub-header a:hover {
      color: #00338d;
    }

    /* Hero Banner Section */
    .hero-section {
      background-color: #0052cc;
      padding: 60px 40px 100px 40px;
      position: relative;
    }

    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      min-height: 420px;
    }

    .hero-image-primary {
      width: 58%;
      height: 380px;
      object-fit: cover;
      position: absolute;
      left: 10%;
      top: 20px;
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .hero-image-secondary {
      width: 48%;
      height: 320px;
      object-fit: cover;
      position: absolute;
      right: 2%;
      top: -20px;
      border-radius: 2px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
      z-index: 2;
    }

    /* Feature Banner */
    .feature-strip {
      background-color: #002266;
      color: #ffffff;
      padding: 25px 40px;
      display: flex;
      align-items: center;
      font-size: 14px;
    }

    .feature-title {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 30%;
      font-size: 13px;
    }

    .feature-description {
      width: 70%;
      font-weight: 400;
      opacity: 0.9;
    }

    /* Mobile Responsiveness */
    @media (max-width: 900px) {
      header {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
      }
      
      .nav-container {
        flex-wrap: wrap;
        justify-content: center;
      }

      .sub-header {
        display: none;
      }

      .hero-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-height: auto;
      }

      .hero-image-primary, .hero-image-secondary {
        position: static;
        width: 100%;
        height: 220px;
      }

      .feature-strip {
        flex-direction: column;
        gap: 10px;
      }

      .feature-title, .feature-description {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="#rfp">Submit RFP</a>
  </div>

  <header>
    <a href="#home">
      <img src="Logo/logo.png" alt="VSAK Logo" class="brand-logo-img">
    </a>

    <div class="nav-container">
      <nav>
        <a href="#home" class="active">Home</a>
        <a href="#about">About us</a>
        <a href="#partners">Partners</a>
        <a href="#gallery">Gallery</a>
      </nav>
      <a href="#contact" class="contact-btn">Contact Us</a>
    </div>
  </header>

  <div class="sub-header">
    <a href="#insights">Insights</a>
    <a href="#industries">Industries</a>
    <a href="#services">Services</a>
    <a href="#how-we-work">How We Work</a>
    <a href="#global-services">VSAK Global Services</a>
  </div>

  <section class="hero-section" id="home">
    <div class="hero-container">
      <img 
        src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1000&q=80" 
        alt="VSAK Team Working" 
        class="hero-image-primary"
      />
      <img 
        src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=800&q=80" 
        alt="VSAK Discussion" 
        class="hero-image-secondary"
      />
    </div>
  </section>

  <div class="feature-strip">
    <div class="feature-title">WHAT SETS US APART</div>
    <div class="feature-description">
      Being agile, more connected, and standing at the forefront of technological and strategic transformation.
    </div>
  </div>

</body>
</html>
