<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSAK | Official Site</title>
  <style>
    /* Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Top Utility Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      padding: 8px 40px;
      font-size: 13px;
      color: #00338d;
      background-color: #fff;
    }

    .top-bar a:hover {
      text-decoration: underline;
    }

    /* Main Navigation Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 40px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Logo Image Container */
    .brand-logo-img {
      height: 125px;
      width: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply; 
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      font-size: 15px;
      font-weight: 600;
      color: #4a4a4a;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: #00338d;
    }

    /* Contact Button */
    .contact-btn {
      background-color: #00338d;
      color: #ffffff !important;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.2s ease;
    }

    .contact-btn:hover {
      background-color: #002266;
    }

    /* Hero Banner Section */
    .hero-section {
      background-color: #0052cc;
      padding: 60px 40px 100px 40px;
      position: relative;
    }

    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      min-height: 420px;
    }

    .hero-image-primary {
      width: 58%;
      height: 380px;
      object-fit: cover;
      position: absolute;
      left: 10%;
      top: 20px;
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
